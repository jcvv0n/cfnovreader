<!doctype html>
<html lang="zh-CN" data-theme="{{THEME}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小说一览</title>
    {{{RAW:THEME_PRELOAD}}}
    <style>
      {{{RAW:THEME_STYLE}}}
      body { padding-top: 52px; }
      p{text-indent:10px;}
      a{font-family:SimHei;font-size:20px;letter-spacing:1px;text-decoration:none;}
      .page-tools {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1001;
      }
      .page-tool {
        min-width: 44px;
        min-height: 36px;
        padding: 6px 12px;
        border: 1px solid var(--theme-border);
        border-radius: 6px;
        background: var(--theme-popup-bg);
        color: var(--theme-text);
        cursor: pointer;
        font: inherit;
      }
      #theme-popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: var(--theme-popup-bg);
        border-bottom: 1px solid var(--theme-border);
        padding: 8px 76px 8px 8px;
        z-index: 1000;
        text-align: center;
        box-sizing: border-box;
      }
      #theme-popup[hidden] { display: none; }
      .theme-option {
        width: 40px;
        height: 40px;
        display: inline-block;
        margin: 0 4px;
        position: relative;
        cursor: pointer;
        border: 2px solid var(--theme-border);
        border-radius: 50%;
        vertical-align: top;
      }
      .theme-option[aria-current="true"] {
        outline: 3px solid var(--theme-focus);
        outline-offset: 2px;
      }
      .theme-option::before {
        content: attr(data-check);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 12px;
        color: white;
        text-shadow: 0 1px 2px #000;
      }
      .resume-link {
        margin-left: 10px;
        font-size: 15px;
      }
      .page-tool:focus-visible,
      .theme-option:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--theme-focus);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="page-tools">
      <button
        type="button"
        id="theme-toggle"
        class="page-tool"
        aria-controls="theme-popup"
        aria-expanded="false"
      >
        主题
      </button>
    </div>
    <div id="theme-popup" hidden role="group" aria-label="选择主题">{{{RAW:THEME_OPTIONS}}}</div>
    <header align="center">
      <h2>小说一览</h2>
    </header>
    <main align="left">{{{RAW:STORY_OVERVIEW}}}</main>
    <!-- prettier-ignore -->
    <script>{{{RAW:THEME_SCRIPT}}}</script>
  </body>
</html>
