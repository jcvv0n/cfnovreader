<!doctype html>
<html lang="zh-CN" data-theme="{{THEME}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>目录</title>
    {{{RAW:THEME_PRELOAD}}}
    <style>
      {{{RAW:THEME_STYLE}}}
      body { padding-top: 52px; }
      p{text-indent:10px;}
      a{font-family:SimHei;font-size:20px;letter-spacing:1px;text-decoration:none;}
      .page-tools {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1001;
      }
      .page-tool {
        min-width: 44px;
        min-height: 36px;
        padding: 6px 12px;
        border: 1px solid var(--theme-border);
        border-radius: 6px;
        background: var(--theme-popup-bg);
        color: var(--theme-text);
        cursor: pointer;
        font: inherit;
      }
      .pagination {
        margin: 10px 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        row-gap: 10px;
        column-gap: 12px;
      }
      .pagination__group {
        display: inline-flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 5px;
      }
      .pagination__nav a,
      .pagination__jump input,
      .pagination__jump button {
        padding: 5px 10px;
        font-size: 18px;
        border: 1px solid var(--theme-border);
        border-radius: 4px;
        height: 30px;
        vertical-align: middle;
      }
      .pagination__nav a,
      .pagination__jump button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--theme-surface);
        color: var(--theme-link);
        min-width: 44px;
      }
      .arrow {
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .pagination__jump input {
        width: 60px;
        text-align: center;
        background: var(--theme-bg);
        color: var(--theme-text);
      }
      .pagination__jump label,
      .pagination__jump span {
        white-space: nowrap;
      }
      .pagination .disabled {
        color: var(--theme-muted);
        opacity: 0.65;
        pointer-events: none;
      }
      @media (max-width: 480px) {
        .pagination__nav a,
        .pagination__jump input,
        .pagination__jump button {
          padding: 6px 8px;
          font-size: 20px;
          height: 38px;
        }
        .pagination__jump input {
          width: 54px;
        }
        .pagination__jump label,
        .pagination__jump span {
          font-size: 17px;
        }
      }
      @media (max-width: 360px) {
        .pagination__jump span[aria-hidden='true'] {
          display: none;
        }
      }
      .breadcrumbs {
        max-width: 760px;
        margin: 0 auto 8px;
        padding: 0 16px;
        color: var(--theme-muted);
        font-size: 15px;
      }
      .breadcrumbs a { font-size: 16px; }
      #theme-popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: var(--theme-popup-bg);
        border-bottom: 1px solid var(--theme-border);
        padding: 8px 76px 8px 8px;
        z-index: 1000;
        text-align: center;
        box-sizing: border-box;
      }
      #theme-popup[hidden] { display: none; }
      .theme-option {
        width: 40px;
        height: 40px;
        display: inline-block;
        margin: 0 4px;
        position: relative;
        cursor: pointer;
        border: 2px solid var(--theme-border);
        border-radius: 50%;
        vertical-align: top;
      }
      .theme-option[aria-current="true"] {
        outline: 3px solid var(--theme-focus);
        outline-offset: 2px;
      }
      .theme-option::before {
        content: attr(data-check);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 12px;
        color: white;
        text-shadow: 0 1px 2px #000;
      }
      #resume-link[hidden] { display: none; }
      #resume-link a { font-size: 16px; }
      .page-tool:focus-visible,
      .theme-option:focus-visible,
      .pagination a:focus-visible,
      .pagination button:focus-visible,
      .pagination input:focus-visible {
        outline: 3px solid var(--theme-focus);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body data-story-id="{{STORY_ID}}">
    <div class="page-tools">
      <button
        type="button"
        id="theme-toggle"
        class="page-tool"
        aria-controls="theme-popup"
        aria-expanded="false"
      >
        主题
      </button>
    </div>
    <div id="theme-popup" hidden role="group" aria-label="选择主题">{{{RAW:THEME_OPTIONS}}}</div>
    <nav class="breadcrumbs" aria-label="页面层级">
      <a href="/r/{{ENC_NAMESPACE}}/stos/1?theme={{THEME}}">小说一览</a>
      <span aria-hidden="true"> / </span>
      <span>{{STORY_NAME}}</span>
    </nav>
    <main align="left">
      <h2>{{STORY_NAME}}</h2>
      <p id="resume-link" hidden>
        <a
          id="resume-link-anchor"
          href="/r/{{ENC_NAMESPACE}}/cont/{{ENC_STORY_ID}}?p=1&theme={{THEME}}"
          >继续阅读</a
        >
      </p>
      {{{RAW:STORY_CATALOG}}}
    </main>
    <form class="pagination" id="paginationForm">
      <span class="pagination__group pagination__nav" aria-label="翻页">
        <a
          href="/r/{{ENC_NAMESPACE}}/cat/{{ENC_STORY_ID}}?p=1&theme={{THEME}}"
          title="首页"
          aria-label="第一页"
          aria-disabled="{{FIRST_ARIA_DISABLED}}"
          tabindex="{{FIRST_TABINDEX}}"
          class="{{FIRST_DISABLED}}"
          ><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em">
            <polyline points="15 18 9 12 15 6"></polyline>
            <polyline points="21 18 15 12 21 6"></polyline></svg
        ></a>
        <a
          href="/r/{{ENC_NAMESPACE}}/cat/{{ENC_STORY_ID}}?p={{PREV_PAGE}}&theme={{THEME}}"
          title="上一页"
          aria-label="上一页"
          aria-disabled="{{PREV_ARIA_DISABLED}}"
          tabindex="{{PREV_TABINDEX}}"
          class="{{PREV_DISABLED}}"
          ><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em">
            <polyline points="15 18 9 12 15 6"></polyline></svg
        ></a>
        <a
          href="/r/{{ENC_NAMESPACE}}/cat/{{ENC_STORY_ID}}?p={{NEXT_PAGE}}&theme={{THEME}}"
          title="下一页"
          aria-label="下一页"
          aria-disabled="{{NEXT_ARIA_DISABLED}}"
          tabindex="{{NEXT_TABINDEX}}"
          class="{{NEXT_DISABLED}}"
          ><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em">
            <polyline points="9 18 15 12 9 6"></polyline></svg
        ></a>
        <a
          href="/r/{{ENC_NAMESPACE}}/cat/{{ENC_STORY_ID}}?p={{TOTAL_PAGES}}&theme={{THEME}}"
          title="尾页"
          aria-label="最后一页"
          aria-disabled="{{LAST_ARIA_DISABLED}}"
          tabindex="{{LAST_TABINDEX}}"
          class="{{LAST_DISABLED}}"
          ><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em">
            <polyline points="9 18 15 12 9 6"></polyline>
            <polyline points="3 18 9 12 3 6"></polyline></svg
        ></a>
      </span>
      <span class="pagination__group pagination__jump" aria-label="跳转页码">
        <label for="pageInput">第</label>
        <input
          type="number"
          id="pageInput"
          value="{{CURRENT_PAGE}}"
          min="1"
          max="{{TOTAL_PAGES}}"
          step="1"
          inputmode="numeric"
          required
          aria-label="页码"
        />
        <span aria-hidden="true">/ {{TOTAL_PAGES}}</span>
        <button type="submit">跳转</button>
      </span>
    </form>
    <!-- prettier-ignore -->
    <script>{{{RAW:THEME_SCRIPT}}}</script>
    <script>
      function goToPage(event) {
        event.preventDefault();
        const input = document.getElementById('pageInput');
        const page = Number(input.value);
        const max = Number(input.max);
        if (!Number.isInteger(page) || page < 1 || page > max) {
          input.setCustomValidity(`请输入 1 到 ${max} 之间的页码`);
          input.reportValidity();
          return;
        }
        input.setCustomValidity('');
        const url = new URL(window.location.href);
        url.searchParams.set('p', String(page));
        window.location.href = url.toString();
      }

      document.getElementById('paginationForm').addEventListener('submit', goToPage);
      document.getElementById('pageInput').addEventListener('input', function () {
        this.setCustomValidity('');
      });
    </script>
  </body>
</html>
